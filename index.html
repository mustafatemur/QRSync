    <!-- NOTIFICATION TOAST -->

    <script>
        /* =========================================
           1. CRYPTOGRAPHY (AES-256 E2EE)
           ========================================= */
        let cryptoKey = null;

        async function deriveKey(sessionCode) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(sessionCode), {name: "PBKDF2"}, false, ["deriveBits", "deriveKey"]
            );
            return window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: enc.encode("qrsync_secure_salt_v1"), iterations: 100000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }

        async function encryptData(text) {
            if (!cryptoKey) return text; // Fallback if crypto fails, though prevented logically
            try {
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const enc = new TextEncoder();
                const ciphertext = await window.crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, cryptoKey, enc.encode(text));
                const payload = new Uint8Array(iv.byteLength + ciphertext.byteLength);
                payload.set(iv, 0);
                payload.set(new Uint8Array(ciphertext), iv.byteLength);
                // Convert to Base64 safely
                let binary = '';
                payload.forEach(b => binary += String.fromCharCode(b));
                return btoa(binary);
            } catch (e) {
                console.error("Encryption failed", e);
                return null;
            }
        }

        async function decryptData(base64Str) {
            if (!cryptoKey) return base64Str;
            try {
                const binary = atob(base64Str);
                const payload = new Uint8Array(binary.length);
                for(let i=0; i<binary.length; i++) payload[i] = binary.charCodeAt(i);
                
                const iv = payload.slice(0, 12);
                const data = payload.slice(12);
                const decrypted = await window.crypto.subtle.decrypt({name: "AES-GCM", iv: iv}, cryptoKey, data);
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                console.error("Decryption failed (Wrong Key or Corrupted)", e);
                return "[Encrypted Message - Unreadable]";
            }
        }

        /* =========================================
           2. HARDWARE AUDIO (BEEPS)
           ========================================= */
        function playSound(type = 'msg') {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'msg') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch(e) {} // Ignore if browser blocks auto-play audio
        }

        /* =========================================
           3. UI & STATE MANAGEMENT
           ========================================= */
        // Dark Mode Logic
        const htmlEl = document.documentElement;
        const btnTheme = document.getElementById('btn-theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');
        
        function toggleTheme() {
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            } else {
                htmlEl.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                iconMoon.classList.add('hidden');
                iconSun.classList.remove('hidden');
            }
        }
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
            iconMoon.classList.add('hidden');
            iconSun.classList.remove('hidden');
        }
        btnTheme.addEventListener('click', toggleTheme);

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.style.backgroundColor = isError ? '#ef4444' : (htmlEl.classList.contains('dark') ? '#374151' : '#1f2937');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 4000);
        }

        function switchView(viewId) {
            ['view-home', 'view-waiting', 'view-chat'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        const savedState = sessionStorage.getItem('qrsync_state_v2');
        const defaultState = {
            clientId: 'cli_' + Math.random().toString(36).substr(2, 9),
            sessionId: null, role: null, isChatActive: false, chatHistory: [] 
        };
        
        const AppState = savedState ? 
            { ...defaultState, ...JSON.parse(savedState), mqtt: null } : 
            { ...defaultState, mqtt: null };

        function saveState() {
            sessionStorage.setItem('qrsync_state_v2', JSON.stringify({
                clientId: AppState.clientId, sessionId: AppState.sessionId,
                role: AppState.role, isChatActive: AppState.isChatActive, chatHistory: AppState.chatHistory
            }));
        }

        function generateQR(sessionId) {
            const connectUrl = `${window.location.href.split('?')[0]}?session=${sessionId}`;
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, { text: connectUrl, width: 180, height: 180, colorDark: "#1e1b4b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
        }

        /* =========================================
           4. MQTT NETWORK LOGIC
           ========================================= */
        function connectMQTT(callback, brokerIndex = 0) {
            if (typeof mqtt === 'undefined') return callback(false, "System libraries failed to load.");
            if (AppState.mqtt && AppState.mqtt.connected) return callback(true);
            
            if (AppState.mqtt) AppState.mqtt.end();
            const brokers = ['wss://broker.hivemq.com:8443/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
            
            let isResolved = false;

            function tryConnect(idx) {
                if (idx >= brokers.length) return isResolved || (isResolved = true, callback(false, "Network blocks WebSockets."));
                
                try {
                    const client = mqtt.connect(brokers[idx], { connectTimeout: 4000, reconnectPeriod: 2000, keepalive: 30 });
                    let timer = setTimeout(() => { if (!client.connected && !isResolved) { client.end(); tryConnect(idx + 1); } }, 4500);

                    client.on('connect', () => {
                        clearTimeout(timer);
                        if (!isResolved) {
                            isResolved = true;
                            AppState.mqtt = client;
                            AppState.mqtt.on('message', handleIncomingMessage);
                            callback(true, null, idx); 
                        }
                    });
                    client.on('error', () => { if (!isResolved) { clearTimeout(timer); client.end(); tryConnect(idx + 1); } });
                } catch (e) { if (!isResolved) tryConnect(idx + 1); }
            }
            tryConnect(brokerIndex);
        }

        async function handleIncomingMessage(topic, message) {
            let data;
            try { data = JSON.parse(message.toString()); } catch (e) { return; }
            if (data.senderId === AppState.clientId) return;

            const sysTopic = `qsys/${AppState.sessionId}`;
            const chatTopic = `qchat/${AppState.sessionId}`;

            if (topic === sysTopic) {
                if (AppState.role === 'host' && data.type === 'join_request') {
                    AppState.guestWaitingId = data.senderId;
                    showApprovalModal();
                    playSound('msg');
                } 
                else if (AppState.role === 'guest' && data.type === 'join_response' && data.targetId === AppState.clientId) {
                    if (data.status === 'accepted') {
                        showToast("Connection Approved!");
                        playSound('success');
                        startChat();
                    } else { showToast("Rejected.", true); resetApp(); }
                }
                else if (data.type === 'typing') {
                    const ind = document.getElementById('typing-indicator');
                    if (data.status === 'start') { ind.classList.remove('hidden'); }
                    else { ind.classList.add('hidden'); }
                }
                else if (data.type === 'leave') { showToast("Other device disconnected.", true); resetApp(); }
            }
            else if (topic === chatTopic && data.type === 'chat') {
                const ind = document.getElementById('typing-indicator');
                ind.classList.add('hidden'); // hide typing when msg arrives
                
                // DECRYPT DATA
                const decryptedStr = await decryptData(data.payload);
                if (decryptedStr) {
                    try {
                        const parsedPayload = JSON.parse(decryptedStr);
                        renderMessage(parsedPayload, 'other');
                        playSound('msg');
                    } catch(e) {} // Ignore malformed JSON
                }
            }
        }

        /* =========================================
           5. CHAT, MEDIA & CAMERA LOGIC
           ========================================= */
        async function sendEncryptedMessage(payloadObj) {
            if (!AppState.mqtt || !cryptoKey) return;
            const jsonStr = JSON.stringify(payloadObj);
            const encryptedPayload = await encryptData(jsonStr);
            if (encryptedPayload) {
                const msg = { type: 'chat', senderId: AppState.clientId, payload: encryptedPayload };
                AppState.mqtt.publish(`qchat/${AppState.sessionId}`, JSON.stringify(msg), { qos: 0 });
                renderMessage(payloadObj, 'me');
            }
        }

        function renderMessage(payload, senderType, shouldSave = true) {
            const container = document.getElementById('chat-messages');
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${senderType === 'me' ? 'justify-end' : 'justify-start'} z-10 relative`;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `max-w-[75%] px-4 py-3 rounded-2xl text-sm shadow-sm break-words ${senderType === 'me' ? 'chat-bubble-me' : 'chat-bubble-other'}`;
            
            if (payload.type === 'text') {
                msgDiv.textContent = payload.data;
            } else if (payload.type === 'image') {
                const img = document.createElement('img');
                img.src = payload.data;
                img.className = 'rounded-lg max-w-full h-auto mt-1 cursor-pointer';
                img.onclick = () => {
                    const w = window.open("");
                    w.document.write(`<img src="${payload.data}" style="max-width:100%;">`);
                };
                msgDiv.appendChild(img);
            }
            
            wrapper.appendChild(msgDiv);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;

            if (shouldSave) {
                AppState.chatHistory.push({ payload, senderType });
                saveState();
            }
        }

        function loadChatHistory() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '<div class="text-center w-full"><span class="bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs px-3 py-1 rounded-full">Encrypted connection established.</span></div><div id="typing-indicator" class="hidden absolute bottom-2 left-6 bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-400 text-xs px-3 py-1.5 rounded-full flex items-center space-x-1"><span>Typing</span><span class="w-1 h-1 bg-gray-500 dark:bg-gray-400 rounded-full animate-bounce"></span><span class="w-1 h-1 bg-gray-500 dark:bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span><span class="w-1 h-1 bg-gray-500 dark:bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></span></div>';
            
            AppState.chatHistory.forEach(item => renderMessage(item.payload, item.senderType, false));
        }

        // Image Attachment (Compress to Base64)
        document.getElementById('btn-attach').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    // Compress as JPEG
                    const base64Img = canvas.toDataURL('image/jpeg', 0.6); 
                    sendEncryptedMessage({ type: 'image', data: base64Img });
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
            e.target.value = ''; // Reset
        });

        // HTML5 QR Scanner
        let html5QrcodeScanner = null;
        document.getElementById('btn-camera').addEventListener('click', () => {
            if (typeof Html5Qrcode === 'undefined') return showToast("Scanner library not loaded.", true);
            const container = document.getElementById('scanner-container');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, 
                (decodedText) => {
                    // Send scanned data instantly!
                    sendEncryptedMessage({ type: 'text', data: `[SCANNED]: ${decodedText}` });
                    playSound('success');
                    // auto close scanner after scan
                    document.getElementById('btn-close-scanner').click();
                }, (error) => {}).catch(err => {
                    container.classList.add('hidden');
                    showToast("Camera permission denied.", true);
                });
            }
        });
        document.getElementById('btn-close-scanner').addEventListener('click', () => {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('scanner-container').classList.add('hidden');
                });
            }
        });

        // Typing Indicator Logic
        let typingTimer;
        document.getElementById('input-chat').addEventListener('input', () => {
            if(!AppState.mqtt) return;
            AppState.mqtt.publish(`qsys/${AppState.sessionId}`, JSON.stringify({type: 'typing', senderId: AppState.clientId, status: 'start'}), {qos:0});
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                AppState.mqtt.publish(`qsys/${AppState.sessionId}`, JSON.stringify({type: 'typing', senderId: AppState.clientId, status: 'stop'}), {qos:0});
            }, 1000);
        });

        /* =========================================
           6. INITIALIZATION & EVENTS
           ========================================= */
        document.addEventListener('DOMContentLoaded', async () => {
            // Restore Session
            if (AppState.sessionId && AppState.role) {
                cryptoKey = await deriveKey(AppState.sessionId); // Re-derive key
                let bIndex = ['H', 'E', 'M'].indexOf(AppState.sessionId.charAt(0));
                
                if (AppState.role === 'host') {
                    document.getElementById('display-session-code').innerText = AppState.sessionId;
                    generateQR(AppState.sessionId);
                    if (AppState.isChatActive) { switchView('view-chat'); loadChatHistory(); } 
                    else { switchView('view-waiting'); }
                } else {
                    document.getElementById('input-join-code').value = AppState.sessionId;
                    if (AppState.isChatActive) { switchView('view-chat'); loadChatHistory(); } 
                    else { switchView('view-home'); }
                }

                connectMQTT((success) => {
                    if (success) {
                        AppState.mqtt.subscribe(`qsys/${AppState.sessionId}`, { qos: 0 });
                        if (AppState.isChatActive) {
                            AppState.mqtt.subscribe(`qchat/${AppState.sessionId}`, { qos: 0 });
                        } else if (AppState.role === 'guest') {
                            AppState.mqtt.publish(`qsys/${AppState.sessionId}`, JSON.stringify({ type: 'join_request', senderId: AppState.clientId }), { qos: 0 });
                        }
                    } else resetApp();
                }, bIndex === -1 ? 0 : bIndex);
            } else {
                const sessionFromUrl = new URLSearchParams(window.location.search).get('session');
                if (sessionFromUrl) {
                    document.getElementById('input-join-code').value = sessionFromUrl;
                    setTimeout(() => document.getElementById('btn-join-room').click(), 500); 
                }
            }

            // Create Room
            const btnCreate = document.getElementById('btn-create-room');
            btnCreate.addEventListener('click', () => {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = 'H'; // Always HiveMQ for primary creation
                for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
                
                btnCreate.innerHTML = '<span class="animate-pulse">Securing Room...</span>';
                btnCreate.disabled = true;

                connectMQTT(async (success, errorMsg) => {
                    btnCreate.innerHTML = '<span>Create Secure Room</span>';
                    btnCreate.disabled = false;
                    if (!success) return showToast(errorMsg, true);

                    AppState.role = 'host';
                    AppState.sessionId = code;
                    cryptoKey = await deriveKey(code); // Generate Crypto Key
                    
                    AppState.isChatActive = false;
                    AppState.chatHistory = [];
                    saveState(); 

                    AppState.mqtt.subscribe(`qsys/${AppState.sessionId}`, { qos: 0 });
                    document.getElementById('display-session-code').innerText = AppState.sessionId;
                    generateQR(AppState.sessionId);
                    switchView('view-waiting');
                    playSound('success');
                });
            });

            // Join Room
            const btnJoin = document.getElementById('btn-join-room');
            btnJoin.addEventListener('click', () => {
                const code = document.getElementById('input-join-code').value.trim().toUpperCase();
                if (code.length !== 7) return showToast("Enter 7-character code.", true);
                let bIndex = ['H', 'E', 'M'].indexOf(code.charAt(0));
                
                btnJoin.innerText = "Connecting...";
                btnJoin.disabled = true;
                
                connectMQTT(async (success, errorMsg) => {
                    btnJoin.innerText = "Join Securely";
                    btnJoin.disabled = false;
                    if (!success) return showToast(errorMsg, true);

                    AppState.role = 'guest';
                    AppState.sessionId = code;
                    cryptoKey = await deriveKey(code); // Generate Crypto Key

                    AppState.isChatActive = false;
                    AppState.chatHistory = [];
                    saveState(); 

                    AppState.mqtt.subscribe(`qsys/${AppState.sessionId}`, { qos: 0 }, (err) => {
                        if(!err) {
                            AppState.mqtt.publish(`qsys/${AppState.sessionId}`, JSON.stringify({ type: 'join_request', senderId: AppState.clientId }), { qos: 0 });
                            showToast("Request sent securely...");
                        } else showToast("Cannot reach room.", true);
                    });
                }, bIndex === -1 ? 0 : bIndex);
            });

            document.getElementById('btn-cancel-waiting').addEventListener('click', resetApp);
            document.getElementById('btn-leave-chat').addEventListener('click', () => {
                if (AppState.mqtt) AppState.mqtt.publish(`qsys/${AppState.sessionId}`, JSON.stringify({ type: 'leave', senderId: AppState.clientId }), { qos: 0 });
                resetApp();
            });

            // Chat Submit
            document.getElementById('form-chat').addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('input-chat');
                const text = input.value.trim();
                if (text) {
                    sendEncryptedMessage({ type: 'text', data: text });
                    input.value = '';
                }
            });

            // Modal Approvals
            document.getElementById('btn-approve').addEventListener('click', () => {
                AppState.mqtt.publish(`qsys/${AppState.sessionId}`, JSON.stringify({ type: 'join_response', senderId: AppState.clientId, targetId: AppState.guestWaitingId, status: 'accepted' }), { qos: 0 });
                closeApprovalModal();
                playSound('success');
                startChat();
            });
            document.getElementById('btn-reject').addEventListener('click', () => {
                AppState.mqtt.publish(`qsys/${AppState.sessionId}`, JSON.stringify({ type: 'join_response', senderId: AppState.clientId, targetId: AppState.guestWaitingId, status: 'rejected' }), { qos: 0 });
                closeApprovalModal();
                AppState.guestWaitingId = null;
            });
            
            // Copy Link
            document.getElementById('btn-copy-link').addEventListener('click', () => {
                const url = `${window.location.href.split('?')[0]}?session=${AppState.sessionId}`;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(url).then(() => showToast("Copied!"));
                } else {
                    const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast("Copied!");
                }
            });
        });

        function startChat() {
            AppState.isChatActive = true;
            saveState(); 
            AppState.mqtt.subscribe(`qchat/${AppState.sessionId}`, { qos: 0 });
            switchView('view-chat');
        }

        function resetApp() {
            if (AppState.mqtt) {
                if(AppState.sessionId) AppState.mqtt.unsubscribe(`qsys/${AppState.sessionId}`);
                if(AppState.sessionId) AppState.mqtt.unsubscribe(`qchat/${AppState.sessionId}`);
            }
            AppState.sessionId = null; AppState.role = null; AppState.isChatActive = false; AppState.guestWaitingId = null; AppState.chatHistory = []; cryptoKey = null;
            saveState(); 
            
            document.getElementById('input-join-code').value = '';
            document.getElementById('btn-join-room').innerText = "Join Securely";
            if(html5QrcodeScanner) document.getElementById('btn-close-scanner').click();
            switchView('view-home');
        }

        function showApprovalModal() {
            document.getElementById('waiting-spinner').classList.add('hidden');
            const area = document.getElementById('area-room-permission');
            area.classList.remove('hidden');
            setTimeout(() => { area.classList.remove('opacity-0', 'scale-95'); area.classList.add('opacity-100', 'scale-100'); }, 10);
        }

        function closeApprovalModal() {
            const area = document.getElementById('area-room-permission');
            area.classList.remove('opacity-100', 'scale-100');
            area.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                area.classList.add('hidden');
                if (!AppState.isChatActive) document.getElementById('waiting-spinner').classList.remove('hidden');
            }, 300);
        }
    </script>
</body>
</html>
